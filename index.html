<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accio Matrix</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 56'%3E%3Cpath d='M32 2 L62 54 H2 Z' fill='none' stroke='%23f26b1d' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M32 22 L46 46 H18 Z' fill='none' stroke='%23e8411c' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&family=Inter:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      font-family: "Open Sans", sans-serif;
      color: #212529;
    }

    /* Header */
    .navbar {
      height: 54px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .brand svg { width: 44px; height: 40px; }

    .brand span {
      font-family: "Lexend", sans-serif;
      font-weight: 500;
      font-size: 22px;
      color: #111111;
      letter-spacing: 0.5px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .username {
      font-family: "Open Sans", sans-serif;
      font-size: 16px;
      color: #1f2937;
    }

    .logout-btn {
      background: #f26b1d;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      height: 39px;
      padding: 0 14px;
      font-family: "Open Sans", sans-serif;
      font-size: 15px;
      cursor: pointer;
    }

    .logout-btn:hover { background: #e15e12; }

    /* Card */
    .wrapper {
      display: flex;
      justify-content: center;
      padding-top: 23px;
    }

    .card {
      width: 626px;
      background: #f9fafb;
      border-radius: 6px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      padding: 24px 24px 41px;
    }

    .card h1 {
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: #333333;
      text-align: center;
      margin-bottom: 22px;
    }

    .message-box {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #f9fafb;
      padding: 14px 16px 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      font-size: 16px;
      line-height: 24px;
      color: #333333;
    }

    .message-box p { margin-bottom: 5px; }
    .message-box p:last-child { margin-bottom: 0; }

    .message-box a {
      color: #0000ee;
      font-style: italic;
      font-weight: 700;
      text-decoration: underline;
    }

    .message-box .phone {
      font-style: italic;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .navbar { padding: 0 16px; }
      .wrapper { padding: 23px 16px 0; }
      .card { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a class="brand" href="#">
      <svg viewBox="0 0 64 56" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7931e"/>
            <stop offset="1" stop-color="#e8411c"/>
          </linearGradient>
        </defs>
        <path d="M32 3 L61 53 H3 Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
        <path d="M32 20 L46 45 H18 Z" fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"/>
        <path d="M24 53 L32 40 L40 53" fill="none" stroke="#e8411c" stroke-width="5" stroke-linejoin="round"/>
      </svg>
      <span>AccioMatrix</span>
    </a>
    <div class="nav-right">
      <span class="username">SATWIKK</span>
      <button class="logout-btn">Logout</button>
    </div>
  </header>

  <main class="wrapper">
    <section class="card">
      <h1>Assessment Completed!</h1>
      <div class="message-box">
        <p>Your feedback is submitted</p>
        <p>If you have any queries, please reach out to us at<br>
          <a href="mailto:contactus@acciomatrix.com">contactus@acciomatrix.com</a><br>
          or <span class="phone">+91 8595563221</span>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
